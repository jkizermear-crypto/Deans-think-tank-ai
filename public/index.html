<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dean's Think Tank</title><style>body{font:16px system-ui;background:#111827;color:#f1f5f9;max-width:820px;margin:auto;padding:20px}section{background:#1e293b;border-radius:12px;padding:16px;margin:16px 0}button{background:#456cba;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}button:disabled{opacity:.5}textarea{width:95%;min-height:90px;background:#0f172a;color:white;padding:10px}.msg{padding:10px;border-bottom:1px solid #475569;white-space:pre-wrap}small{color:#cbd5e1}</style></head><body><h1>Dean's Think Tank</h1><section id="authentication"><h2>Private account</h2><p id="auth-status">Checking invitation…</p><div id="invite-panel" hidden><label>Choose a password (12+ characters)<br><input type="password" id="invite-password" autocomplete="new-password"></label><p><button id="accept-invite">Activate invitation</button></p></div><div id="login-panel"><p><input type="email" id="login-email" placeholder="Email" autocomplete="username"></p><p><input type="password" id="login-password" placeholder="Password" autocomplete="current-password"></p><button id="login">Sign in</button></div><button id="logout" hidden>Sign out</button></section><p id="status">Connecting to private room…</p><section><button id="pause" disabled>Pause discussions</button><p id="advisors"></p></section><section><h2>Conversation</h2><div id="messages"></div></section><section><h2>Contribute</h2><textarea id="draft" placeholder="Ask the team…"></textarea><p><button id="send" disabled>Send</button></p><small>Messages persist. Automatic AI responses are not enabled yet; no fabricated replies.</small></section><script>
const $=id=>document.getElementById(id);let paused=false;
async function refresh(){try{const r=await fetch('/api/room',{cache:'no-store'});if(!r.ok){$('status').textContent=r.status===401?'Owner login required':'Room unavailable ('+r.status+')';return}const d=await r.json();paused=!!d.controls?.paused;$('status').textContent=paused?'Paused':'Active room · AI not yet connected';$('pause').textContent=paused?'Resume':'Pause discussions';$('pause').disabled=false;$('send').disabled=false;$('advisors').textContent=d.advisors.map(a=>a.profile?.name||a.id).join(' · ');$('messages').replaceChildren();for(const m of d.messages){const div=document.createElement('div');div.className='msg';const who=document.createElement('strong');who.textContent=m.speaker_id+': ';div.append(who,document.createTextNode(m.content));$('messages').appendChild(div)}if(!d.messages.length)$('messages').textContent='No messages imported yet.'}catch(e){$('status').textContent='Connection unavailable'}}
async function post(body){const r=await fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error((await r.json()).error||'Failed');await refresh()}
$('pause').onclick=async()=>{try{await post({action:'pause',paused:!paused})}catch(e){alert(e.message)}};
$('send').onclick=async()=>{const content=$('draft').value.trim();if(!content)return;$('send').disabled=true;try{await post({action:'message',content});$('draft').value=''}catch(e){alert(e.message)}finally{$('send').disabled=false}};
refresh();setInterval(refresh,12000);
window.addEventListener("tank-auth-ready",refresh);
</script><script type="module" src="/assets/auth.js"></script></body></html>
